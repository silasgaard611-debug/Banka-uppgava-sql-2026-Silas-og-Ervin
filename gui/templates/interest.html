{% extends "layout.html" %}

{% block content %}
<div class="card">
    <h2>Calculate Monthly Interest</h2>
    <p>
        This runs the monthly interest procedure for all accounts for the chosen date.
    </p>

    <form method="POST">
        <label>Date:</label><br>
        <input type="date" name="interest_date" required><br><br>

        <button type="submit">Calculate Interest</button>
    </form>
</div>
{% endblock %}
