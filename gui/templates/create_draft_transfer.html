{% extends "layout.html" %}

{% block content %}
<div class="card">
    <h2>Create Draft Transfer</h2>
    <p>
        The active person can only create a transfer from accounts where they have transfer permission.
    </p>

    <form method="POST">
        <label>From account:</label><br>
        <select name="from_account" required>
            <option value="">Choose from-account</option>
            {% for account in from_accounts %}
                <option value="{{ account[0] }}">
                    {{ account[0] }} - {{ account[2] }} - Balance: {{ account[3] }}
                </option>
            {% endfor %}
        </select><br><br>

        <label>To account:</label><br>
        <select name="to_account" required>
            <option value="">Choose to-account</option>
            {% for account in all_accounts %}
                <option value="{{ account }}">{{ account }}</option>
            {% endfor %}
        </select><br><br>

        <label>Amount:</label><br>
        <input type="number" step="0.01" name="amount" required><br><br>

        <label>Date:</label><br>
        <input type="date" name="transfer_date" required><br><br>

        <button type="submit">Create Draft Transfer</button>
    </form>
</div>
{% endblock %}
